[project]
name = "job-apply-agent"
version = "0.1.0"
description = "Daily AI agent that finds relevant jobs and tailors your resume to a 90+ ATS match score"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=5.1",
    "reportlab>=4.2",
    "PyYAML>=6.0",
    "rapidfuzz>=3.10",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
job-agent = "job_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]
